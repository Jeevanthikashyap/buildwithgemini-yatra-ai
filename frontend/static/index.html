<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YatraAI — Travel &amp; City Concierge</title>
<!-- Optional: used only to draw A2UI Icon components. If it can't load (offline/
     corp network), icons fall back to showing their name as text. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<style>
  :root {
    --accent: #2563EB; /* Royal Blue */
    --accent-dark: #1E3A8A; /* Deep Navy Royal */
    --accent-light: #EEF2FF; /* Soft Indigo Mist */
    --accent-subtle: #E0E7FF;
    --violet-primary: #7C3AED; /* Elegant Violet */
    --violet-dark: #5B21B6; /* Deep Velvet Violet */
    --violet-light: #F5F3FF; /* Violet Glow */
    --bg: #F8FAFC; /* Crisp Clean Slate White */
    --panel-bg: #FFFFFF;
    --border: #E2E8F0;
    --border-light: #F1F5F9;
    --text-primary: #0F172A; /* Deep Obsidian Slate */
    --text-secondary: #475569; /* Polished Slate Gray */
    --user-bubble: linear-gradient(135deg, #1E3A8A 0%, #2563EB 50%, #7C3AED 100%);
    --agent-bubble: #FFFFFF;
    --glass-shadow: 0 4px 20px -2px rgba(30, 58, 138, 0.08), 0 2px 6px -1px rgba(0, 0, 0, 0.04);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  header {
    background: linear-gradient(135deg, #0F172A 0%, #1E3A8A 55%, #6D28D9 100%);
    color: #fff;
    padding: 1.1rem 2rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 20px rgba(15, 23, 42, 0.15);
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  }
  .brand-title {
    display: flex;
    align-items: center;
    gap: 0.65rem;
    font-size: 1.25rem;
    letter-spacing: -0.02em;
  }
  .brand-badge {
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.25);
    padding: 0.25rem 0.65rem;
    border-radius: 20px;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  header .tagline {
    font-size: 0.88rem;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.9);
    letter-spacing: 0.01em;
  }
  
  #wallpaper-bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    transition: background-image 0.8s ease-in-out;
    z-index: 0;
  }
  #wallpaper-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: radial-gradient(circle at top right, rgba(124, 58, 237, 0.15), transparent 60%),
                linear-gradient(180deg, rgba(248, 250, 252, 0.82) 0%, rgba(241, 245, 249, 0.90) 100%);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 1;
  }
  
  #chat-wrapper {
    position: relative;
    z-index: 2;
    flex: 1;
    display: flex;
    flex-direction: column;
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
    overflow: hidden;
  }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem 1.4rem;
    scroll-behavior: smooth;
  }
  .welcome-banner {
    text-align: center;
    padding: 1.8rem 1.5rem;
    margin-bottom: 1.2rem;
    background: rgba(255, 255, 255, 0.92);
    border: 1px solid rgba(226, 232, 240, 0.9);
    border-radius: 20px;
    box-shadow: 0 10px 25px -5px rgba(30, 58, 138, 0.08);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    position: relative;
  }
  .wallpaper-tag {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    padding: 0.25rem 0.65rem;
    background: rgba(37, 99, 235, 0.08);
    border: 1px solid rgba(37, 99, 235, 0.18);
    border-radius: 12px;
    font-size: 0.74rem;
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 0.75rem;
  }
  .welcome-banner h2 {
    margin: 0 0 0.5rem;
    font-size: 1.35rem;
    color: var(--accent-dark);
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .welcome-banner p {
    margin: 0;
    font-size: 0.92rem;
    color: var(--text-secondary);
    line-height: 1.6;
    max-width: 600px;
    margin: 0 auto;
  }

  /* Message row with avatars */
  .msg-row {
    display: flex;
    gap: 0.75rem;
    margin: 1.2rem 0;
    align-items: flex-start;
  }
  .msg-row.user {
    flex-direction: row-reverse;
  }
  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.05rem;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(30, 58, 138, 0.12);
  }
  .avatar.agent {
    background: linear-gradient(135deg, #EEF2FF 0%, #EDE9FE 100%);
    border: 1.5px solid #C7D2FE;
    color: var(--accent);
  }
  .avatar.user {
    background: linear-gradient(135deg, #1E3A8A 0%, #7C3AED 100%);
    color: #fff;
    border: 1.5px solid rgba(255, 255, 255, 0.4);
  }
  .msg-content {
    display: flex;
    flex-direction: column;
    max-width: 82%;
  }
  .msg-row.user .msg-content {
    align-items: flex-end;
  }
  .msg-sender {
    font-size: 0.74rem;
    font-weight: 600;
    margin-bottom: 0.3rem;
    color: var(--text-secondary);
    padding: 0 0.35rem;
    letter-spacing: 0.02em;
  }
  .bubble {
    padding: 0.85rem 1.15rem;
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.94);
    border: 1px solid rgba(226, 232, 240, 0.95);
    color: var(--text-primary);
    text-align: left;
    white-space: pre-wrap;
    line-height: 1.6;
    font-size: 0.95rem;
    box-shadow: 0 4px 15px rgba(15, 23, 42, 0.05);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .bubble a {
    color: var(--accent);
    font-weight: 600;
    text-decoration: none;
    border-bottom: 1.5px solid rgba(37, 99, 235, 0.4);
    transition: all 0.2s ease;
    word-break: break-all;
  }
  .bubble a:hover {
    color: var(--violet-primary);
    border-bottom-color: var(--violet-primary);
  }
  .booking-link-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    margin: 0.35rem 0.25rem 0.35rem 0;
    padding: 0.35rem 0.85rem;
    background: linear-gradient(135deg, #1E3A8A 0%, #2563EB 50%, #7C3AED 100%);
    color: #FFFFFF !important;
    border-radius: 20px;
    font-size: 0.82rem;
    font-weight: 600;
    text-decoration: none !important;
    border: none !important;
    box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .booking-link-badge:hover {
    transform: translateY(-1.5px);
    box-shadow: 0 4px 14px rgba(124, 58, 237, 0.35);
  }
  .msg-row.agent .bubble {
    border-top-left-radius: 4px;
  }
  .msg-row.user .bubble {
    background: linear-gradient(135deg, #1E3A8A 0%, #2563EB 55%, #7C3AED 100%);
    color: #FFFFFF;
    border: none;
    border-top-right-radius: 4px;
    box-shadow: 0 4px 15px rgba(37, 99, 235, 0.28);
  }
  .bubble.rich {
    background: transparent;
    border: none;
    padding: 0;
    max-width: 100%;
    white-space: normal;
    box-shadow: none;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
  }

  /* Chips */
  .chips-container {
    display: flex;
    gap: 0.6rem;
    padding: 0.65rem 1.4rem 0.35rem;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .chips-container::-webkit-scrollbar { display: none; }
  .chip {
    background: #FFFFFF;
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 0.5rem 1rem;
    font-size: 0.84rem;
    font-weight: 500;
    color: var(--text-secondary);
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
  }
  .chip:hover {
    background: var(--violet-light);
    border-color: var(--violet-primary);
    color: var(--violet-dark);
    transform: translateY(-1.5px);
    box-shadow: 0 4px 12px rgba(124, 58, 237, 0.15);
  }

  /* Footer & Input */
  .footer-controls {
    background: #FFFFFF;
    border-top: 1px solid var(--border);
    padding: 0.9rem 1.5rem 1.3rem;
    box-shadow: 0 -4px 20px rgba(15, 23, 42, 0.03);
  }
  form {
    display: flex;
    gap: 0.75rem;
    align-items: center;
  }
  input {
    flex: 1;
    padding: 0.85rem 1.2rem;
    border: 1.5px solid var(--border);
    border-radius: 14px;
    font-size: 0.95rem;
    background: #F8FAFC;
    color: var(--text-primary);
    transition: all 0.2s ease;
  }
  input:focus {
    outline: none;
    border-color: var(--accent);
    background: #FFFFFF;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
  }
  button.send-btn {
    padding: 0.85rem 1.5rem;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, #1E3A8A 0%, #2563EB 50%, #7C3AED 100%);
    color: #FFFFFF;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 0.45rem;
    box-shadow: 0 4px 14px rgba(37, 99, 235, 0.25);
  }
  button.send-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 18px rgba(124, 58, 237, 0.35);
  }
  button.send-btn:active {
    transform: scale(0.98);
  }

  /* A2UI Component refinement */
  .a2card {
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.25rem;
    background: #FFFFFF;
    box-shadow: var(--glass-shadow);
    max-width: 100%;
  }
  .a2card + .a2card, .a2col > .a2card { margin-top: 0.8rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.5rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.65rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  .a2text { margin: 0; line-height: 1.5; color: var(--text-primary); }
  .a2text.a2-h1 { font-size: 1.45rem; font-weight: 700; color: var(--accent-dark); letter-spacing: -0.02em; }
  .a2text.a2-h2 { font-size: 1.22rem; font-weight: 700; color: var(--accent); letter-spacing: -0.01em; }
  .a2text.a2-h3 { font-size: 1.08rem; font-weight: 600; color: var(--violet-dark); }
  .a2text.a2-h4 { font-size: 0.96rem; font-weight: 600; color: var(--text-primary); }
  .a2text.a2-caption { font-size: 0.84rem; color: var(--text-secondary); font-weight: 400; }
  .a2divider { border: none; border-top: 1px solid var(--border); margin: 0.65rem 0; width: 100%; }
  .a2img { max-width: 100%; border-radius: 12px; display: block; box-shadow: 0 4px 14px rgba(15, 23, 42, 0.08); }
  .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-size: 1.35rem; line-height: 1; vertical-align: middle; color: var(--accent); }
</style>
</head>
<body>
<header>
  <div class="brand-title">
    <span>🌐 YatraAI</span>
    <span class="brand-badge">Global Concierge</span>
  </div>
  <span class="tagline">International Flights, Hotels &amp; Smart Transit</span>
</header>

<div id="wallpaper-bg"></div>
<div id="wallpaper-overlay"></div>

<div id="chat-wrapper">
  <div id="log">
    <div class="welcome-banner">
      <div id="wallpaper-location-badge" class="wallpaper-tag">📍 Exploring Exotic World Destinations</div>
      <h2>✨ Welcome to YatraAI Concierge</h2>
      <p>Your intelligent, luxury companion for global flights, handpicked hotels, instant confirmed bookings, and real-time multi-modal price drop alerts.</p>
    </div>
  </div>

  <div class="footer-controls">
    <div class="chips-container" id="chips">
      <button type="button" class="chip" data-prompt="Find the cheapest flights from Bangalore to Singapore next month under ₹20,000">✈️ Cheap Flights to Singapore</button>
      <button type="button" class="chip" data-prompt="Search 4-star hotels in Dubai near Dubai Marina with Indian vegetarian food options">🏨 Dubai Hotels (Veg friendly)</button>
      <button type="button" class="chip" data-prompt="Set up a price drop alert for flights from Bangalore to Singapore and check active alerts">🔔 Price Drop Watch &amp; Alerts</button>
      <button type="button" class="chip" data-prompt="Plan 3 days in Hampi, vegetarian, slow pace, under ₹15,000">🏛️ 3 Days in Hampi (Veg, ₹15k)</button>
    </div>
    <form id="form">
      <input id="input" placeholder="Ask YatraAI anything about your trip…" autocomplete="off" autofocus>
      <button class="send-btn">
        <span>Send</span>
        <span>➤</span>
      </button>
    </form>
  </div>
</div>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function bubble(who) {
  const row = el("div", "msg-row " + who);
  const avatar = el("div", "avatar " + who, who === "user" ? "👤" : "🧭");
  const content = el("div", "msg-content");
  const sender = el("div", "msg-sender", who === "user" ? "You" : "YatraAI Concierge");
  const b = el("div", "bubble");
  
  content.appendChild(sender);
  content.appendChild(b);
  row.appendChild(avatar);
  row.appendChild(content);
  
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
  return b;
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * Renders Card / Column / Row / Text / Divider / List / Image / Icon.
 * Anything else falls back to plain text (see renderReply). All text goes in via
 * textContent and image URLs are validated, so agent output can't inject HTML.
 * -------------------------------------------------------------------------- */

// A "bound value" is usually {literalString: "..."}; we only support literals.
function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

// child ids of a component's props: single `child` and/or `children.explicitList`.
function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

// A2UI icon names are camelCase (locationOn); Material Symbols wants snake_case.
function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;   // missing / cycle guard
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;   // only allow safe URLs
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;   // unknown component -> skipped (text fallback covers content)
  }
}

// Render one or more A2UI messages (beginRendering + surfaceUpdate) into `container`.
// Returns true if anything was drawn.
function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {   // no valid root given -> infer un-referenced components
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

// Fallback: pull every Text value out of the messages as plain text.
function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

// Convert markdown links [Label](url) and bare URLs to interactive links and stylish booking badges
function formatTextWithLinks(container, text) {
  // Regex to match [text](url) OR raw URLs
  const linkRegex = /\[([^\]]+)\]\((https?:\/\/[^\s\)]+)\)|(https?:\/\/[^\s\)]+)/g;
  let lastIndex = 0;
  let match;

  while ((match = linkRegex.exec(text)) !== null) {
    if (match.index > lastIndex) {
      container.appendChild(document.createTextNode(text.substring(lastIndex, match.index)));
    }
    
    const label = match[1];
    const url = match[2] || match[3];
    const isBooking = /book|flight|irctc|ksrtc|hotel|makemytrip|singaporeair|emirates|airindia|goindigo|ana\.co/i.test(url) || /book/i.test(label || "");

    const a = document.createElement("a");
    a.href = url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    
    if (isBooking) {
      a.className = "booking-link-badge";
      a.innerHTML = `<span>🎫</span> <span>${label || "Book Now"}</span> <span>↗</span>`;
    } else {
      a.textContent = label || url;
    }
    
    container.appendChild(a);
    lastIndex = linkRegex.lastIndex;
  }

  if (lastIndex < text.length) {
    container.appendChild(document.createTextNode(text.substring(lastIndex)));
  }
}

function renderReply(b, parts) {
  b.textContent = "";   // clear the "…" placeholder
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) {
    const textDiv = el("div", null);
    formatTextWithLinks(textDiv, textStr);
    b.appendChild(textDiv);
  }

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) {
      const fallbackDiv = el("div", null);
      formatTextWithLinks(fallbackDiv, flattenText(a2ui) || "(no card content)");
      b.appendChild(fallbackDiv);
    }
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

/* ----------------------------------------------------------------------------
 * Dynamic Exotic World Wallpapers
 * Selects an exotic world destination on load and on session intervals
 * -------------------------------------------------------------------------- */
const EXOTIC_DESTINATIONS = [
  {
    name: "Santorini, Greece",
    url: "https://images.unsplash.com/photo-1570077188670-e3a8d69ac5ff?auto=format&fit=crop&w=1920&q=80",
    description: "Cliffside whitewashed villas overlooking the sapphire Aegean Sea"
  },
  {
    name: "Kyoto Arashiyama, Japan",
    url: "https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?auto=format&fit=crop&w=1920&q=80",
    description: "Serene towering bamboo groves and historic shrines"
  },
  {
    name: "Amalfi Coast, Italy",
    url: "https://images.unsplash.com/photo-1533105079780-92b9be482077?auto=format&fit=crop&w=1920&q=80",
    description: "Pastel colored towns carved into dramatic Mediterranean cliffs"
  },

function applyRandomWallpaper() {
  const bg = document.getElementById("wallpaper-bg");
  const badge = document.getElementById("wallpaper-location-badge");
  if (!bg) return;

  // Retrieve last index to avoid repeating same image immediately
  let lastIdx = parseInt(sessionStorage.getItem("yatra_wp_idx") || "-1", 10);
  let newIdx;
  do {
    newIdx = Math.floor(Math.random() * EXOTIC_DESTINATIONS.length);
  } while (newIdx === lastIdx && EXOTIC_DESTINATIONS.length > 1);
  
  sessionStorage.setItem("yatra_wp_idx", newIdx);
  const dest = EXOTIC_DESTINATIONS[newIdx];

  const img = new Image();
  img.src = dest.url;
  img.onload = () => {
    bg.style.backgroundImage = `url('${dest.url}')`;
    if (badge) {
      badge.innerHTML = `📍 <strong>${dest.name}</strong> &mdash; ${dest.description}`;
    }
  };
}

// Apply wallpaper immediately upon opening the app
applyRandomWallpaper();

async function sendMessage(text) {
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  const b = bubble("agent"); b.textContent = "…";
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  await sendMessage(text);
});

document.querySelectorAll(".chip").forEach(btn => {
  btn.addEventListener("click", () => {
    const prompt = btn.getAttribute("data-prompt");
    if (prompt) sendMessage(prompt);
  });
});
